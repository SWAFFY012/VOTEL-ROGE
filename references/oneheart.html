<script>
  (function () {
    var CONFIG = {
      speed: 2.8,
      holdTarget: 90,
      minDuration: 1200,
      fadeMs: 600,
      counterFadeMs: 200,
      snapThreshold: 0.5,
      holdAfter100: 450,
      cooldownMs: 30 * 60 * 1000,
      storageKey: 'preloaderLastShown',
    };

    function shouldShow() {
      if (!CONFIG.cooldownMs) return true;
      try {
        var last = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
        if (!last) return true;
        return Date.now() - last >= CONFIG.cooldownMs;
      } catch (e) {
        return true;
      }
    }

    if (!shouldShow()) return;

    function build() {
      if (document.querySelector('[data-preloader]')) return;

      try {
        localStorage.setItem(CONFIG.storageKey, String(Date.now()));
      } catch (e) {}

      var el = document.createElement('div');
      el.className = 'preloader';
      el.setAttribute('data-preloader', '');
      el.innerHTML = '<div class="preloader-counter" data-preloader-counter>001</div>';
      document.body.insertBefore(el, document.body.firstChild);

      var counterEl = el.querySelector('[data-preloader-counter]');

      counterEl.style.transition = 'opacity ' + CONFIG.counterFadeMs + 'ms ease';

      var current = 1;
      var target = CONFIG.holdTarget;
      var loaded = false;
      var startTime = performance.now();
      var lastTime = startTime;
      var done = false;

      function format(n) {
        var v = Math.round(n);
        if (v < 10) return '00' + v;
        if (v < 100) return '0' + v;
        return '100';
      }

      function finish() {
        if (done) return;
        done = true;

        setTimeout(function () {
          counterEl.style.opacity = '0';

          setTimeout(function () {
            el.classList.add('is-hidden');
            setTimeout(function () {
              el.classList.add('is-removed');
            }, CONFIG.fadeMs);
          }, CONFIG.counterFadeMs);
        }, CONFIG.holdAfter100);
      }

      function tick(now) {
        var dt = (now - lastTime) / 1000;
        lastTime = now;
        var factor = 1 - Math.exp(-CONFIG.speed * dt);
        current += (target - current) * factor;
        counterEl.textContent = format(current);
        var elapsed = now - startTime;
        if (loaded && elapsed >= CONFIG.minDuration && 100 - current < CONFIG.snapThreshold) {
          current = 100;
          counterEl.textContent = '100';
          finish();
          return;
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener('load', function () {
        loaded = true;
        target = 100;
      });
      if (document.readyState === 'complete') {
        loaded = true;
        target = 100;
      }

      if (document.fonts && document.fonts.ready) {
        var started = false;
        var go = function () {
          if (!started) {
            started = true;
            requestAnimationFrame(tick);
          }
        };
        document.fonts.ready.then(go);
        setTimeout(go, 300);
      } else {
        requestAnimationFrame(tick);
      }
    }

    if (document.body) {
      build();
    } else {
      document.addEventListener('DOMContentLoaded', build);
    }
  })();
</script>

<script>
  // page-transition.js — Barba swap + CSS fade overlay
  (function () {
    'use strict';
 
    var FADE_MS = 800;
 
    function wait(ms) {
      return new Promise(function (r) {
        setTimeout(r, ms);
      });
    }
 
    function getOverlay() {
      return document.querySelector('.page-transition-overlay');
    }
 
    function syncWebflowPageId(data) {
      try {
        var nextHtml = data && data.next && data.next.html;
        if (!nextHtml) return;
        var m = nextHtml.match(/<html[^>]*\sdata-wf-page="([^"]+)"/i);
        if (m && m[1]) {
          document.documentElement.setAttribute('data-wf-page', m[1]);
        }
      } catch (e) {}
    }
 
    function waitForPaint(container) {
      return new Promise(function (resolve) {
        var imgs = container ? Array.from(container.querySelectorAll('img')) : [];
        var pending = imgs.filter(function (img) {
          return !img.complete && img.loading !== 'lazy';
        });
 
        var imgsReady;
        if (pending.length === 0) {
          imgsReady = Promise.resolve();
        } else {
          imgsReady = Promise.race([
            Promise.all(
              pending.map(function (img) {
                return new Promise(function (res) {
                  img.addEventListener('load', res, { once: true });
                  img.addEventListener('error', res, { once: true });
                });
              }),
            ),
            wait(400),
          ]);
        }
 
        imgsReady.then(function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(resolve);
          });
        });
      });
    }
 
    barba.init({
      preventRunning: true,
      prevent: function (data) {
        var el = data.el;
        if (!el) return true;
        var href = el.getAttribute('href');
        if (!href) return true;
        if (el.getAttribute('target') === '_blank') return true;
        if (href.startsWith('mailto:') || href.startsWith('tel:')) return true;
        if (href.startsWith('#')) return true;
        try {
          var url = new URL(href, window.location.origin);
          if (url.origin !== window.location.origin) return true;
          var cur = window.location.pathname.replace(/\/+$/, '') || '/';
          var tgt = url.pathname.replace(/\/+$/, '') || '/';
          if (cur === tgt) return true;
        } catch (e) {
          return true;
        }
        return false;
      },
      transitions: [
        {
          name: 'fade',
          leave: function () {
            getOverlay().classList.add('is-active');
            return wait(FADE_MS);
          },
          beforeEnter: function (data) {
            if (data.next && data.next.container) {
              data.next.container.classList.add('is-entering');
            }
            window.scrollTo(0, 0);
          },
          enter: function (data) {
            return waitForPaint(data.next.container)
              .then(function () {
                data.next.container.classList.remove('is-entering');
                return wait(20);
              })
              .then(function () {
                getOverlay().classList.remove('is-active');
              });
          },
        },
      ],
    });
 
    barba.hooks.after(function (data) {
      Array.from(data.next.container.querySelectorAll('script')).forEach(function (oldScript) {
        var newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(function (attr) {
          newScript.setAttribute(attr.name, attr.value);
        });
        if (oldScript.innerHTML) newScript.innerHTML = oldScript.innerHTML;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
 
      // Правильный контекст страницы до реинициализации модулей Webflow.
      syncWebflowPageId(data);
 
      if (window.Webflow) {
        try {
          window.Webflow.destroy();
        } catch (e) {}
        try {
          window.Webflow.ready();
        } catch (e) {}
        try {
          var ix2 = window.Webflow.require && window.Webflow.require('ix2');
          if (ix2 && ix2.init) ix2.init();
        } catch (e) {}
       
        try {
          var forms = window.Webflow.require && window.Webflow.require('forms');
          if (forms && forms.ready) forms.ready();
        } catch (e) {}
      }
 
      window.dispatchEvent(
        new CustomEvent('barba:pageEnter', {
          detail: { path: window.location.pathname.replace(/\/+$/, '') || '/' },
        }),
      );
 
      if (window.__initSoundSwitcher) window.__initSoundSwitcher();
      if (window.__initLogoRotation) window.__initLogoRotation();
      if (window.__audio) window.__audio.bindSfx();
    });
  })();
</script>

      var sfxVolumes = {
        click: 0.2, // клик по UI-элементам
        transition: 0.2, // переход между страницами
        tick: 0.2, // тик карусели
        heartbeat: 0.3, // ховер/тап по .image-logo
        hover: 0.1, // ховер по UI-элементам
      };

      var audioCtx = null;
      var sfxGain = null; // master-gain для всех SFX
      var sfxBuffers = {}; // name -> AudioBuffer (декодированные)

      var bgAudio = null;
      var bgStarted = false;

      function ensureCtx() {
        if (audioCtx) return audioCtx;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sfxGain = audioCtx.createGain();
        sfxGain.gain.value = 1.0; // общий множитель SFX
        sfxGain.connect(audioCtx.destination);
        return audioCtx;
      }

      function loadSfxBuffers() {
        ensureCtx();
        Object.keys(sfxUrls).forEach(function (name) {
          if (sfxBuffers[name]) return;
          fetch(sfxUrls[name])
            .then(function (res) {
              return res.arrayBuffer();
            })
            .then(function (arr) {
              return new Promise(function (resolve, reject) {
                audioCtx.decodeAudioData(arr, resolve, reject);
              });
            })
            .then(function (buffer) {
              sfxBuffers[name] = buffer;
            })
            .catch(function () {});
        });
      }

      function createReverbBuffer(ctx) {
        var len = ctx.sampleRate * 4;
        var buf = ctx.createBuffer(2, len, ctx.sampleRate);
        for (var c = 0; c < 2; c++) {
          var d = buf.getChannelData(c);
          for (var i = 0; i < len; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
          }
        }
        return buf;
      }

      function initBgMusic() {
        if (bgStarted) return;
        bgStarted = true;

        ensureCtx();

        bgAudio = new Audio(BG_MUSIC_URL);
        bgAudio.loop = true;
        bgAudio.crossOrigin = 'anonymous';

        var source = audioCtx.createMediaElementSource(bgAudio);
        var filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;
        var reverb = audioCtx.createConvolver();
        reverb.buffer = createReverbBuffer(audioCtx);
        var dryGain = audioCtx.createGain();
        var wetGain = audioCtx.createGain();
        var masterGain = audioCtx.createGain();

        // Громкость фоновой музыки
        dryGain.gain.value = 0.05; // прямой сигнал
        wetGain.gain.value = 0.6; // сигнал через ревербератор
        masterGain.gain.value = 0.1; // итоговая громкость фона (0.0 – 1.0)

        source.connect(filter);
        filter.connect(dryGain);
        filter.connect(reverb);
        reverb.connect(wetGain);
        dryGain.connect(masterGain);
        wetGain.connect(masterGain);
        masterGain.connect(audioCtx.destination);
      }

      function playBg() {
        initBgMusic();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (bgAudio) bgAudio.play().catch(function () {});
      }

      function pauseBg() {
        if (bgAudio) bgAudio.pause();
      }

      function playSfx(name) {
        if (!enabled) return;
        ensureCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        var buffer = sfxBuffers[name];
        var vol = sfxVolumes[name] !== undefined ? sfxVolumes[name] : 1.0;

        if (buffer) {
          var src = audioCtx.createBufferSource();
          src.buffer = buffer;
          var g = audioCtx.createGain();
          g.gain.value = vol;
          src.connect(g);
          g.connect(sfxGain);
          src.start(0);
          src.onended = function () {
            try {
              src.disconnect();
              g.disconnect();
            } catch (e) {}
          };
        } else {
          var url = sfxUrls[name];
          if (!url) return;
          var clone = new Audio(url);
          clone.volume = vol;
          clone.play().catch(function () {});
          clone.onended = function () {
            clone.remove ? clone.remove() : null;
          };
        }
      }

      var firstInteraction = false;
      function onFirstInteraction() {
        if (firstInteraction) return;
        firstInteraction = true;
        ensureCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        loadSfxBuffers();
        if (enabled) playBg();
        window.removeEventListener('click', onFirstInteraction);
        window.removeEventListener('touchstart', onFirstInteraction);
      }
      window.addEventListener('click', onFirstInteraction);
      window.addEventListener('touchstart', onFirstInteraction);

      var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      return {
        setEnabled: function (val) {
          enabled = val;
          try {
            sessionStorage.setItem(STORAGE_KEY, val ? '1' : '0');
          } catch (e) {}
          if (val) {
            ensureCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            loadSfxBuffers();
            if (firstInteraction) playBg();
          } else {
            pauseBg();
          }
        },
        isEnabled: function () {
          return enabled;
        },
        play: playSfx,
        bindSfx: function () {
          var clickSel = '.sound-off, .sound-on, .switcher, .link_socials, .link_menu, .link-close, .link-music, .link-filter, .filter, .submit_button, .link_pp, .link-disc, .nav-overlay, .image-artwork, .button-buy';
          var transSel = '.circle';
          var heartbeatSel = '.image-logo';
          var hoverSel = '.link_menu, .link-close, .link-music, .circle, .link_socials, .submit_button, .link-filter, .filter, .button-buy';

          document.querySelectorAll(clickSel).forEach(function (el) {
            if (el.__sfxBound) return;
            el.__sfxBound = true;
            el.addEventListener('click', function () {
              playSfx('click');
            });
          });
          document.querySelectorAll(transSel).forEach(function (el) {
            if (el.__sfxBound) return;
            el.__sfxBound = true;
            el.addEventListener('click', function () {
              playSfx('transition');
            });
          });
          document.querySelectorAll(heartbeatSel).forEach(function (el) {
            if (el.__sfxHeartbeatBound) return;
            el.__sfxHeartbeatBound = true;
            // Клик — на всех устройствах
            el.addEventListener('click', function () {
              playSfx('heartbeat');
            });
            // Ховер — дополнительно только на десктопе
            if (!isTouch) {
              el.addEventListener('mouseenter', function () {
                playSfx('heartbeat');
              });
            }
          });
          if (!isTouch) {
            document.querySelectorAll(hoverSel).forEach(function (el) {
              if (el.__sfxHoverBound) return;
              el.__sfxHoverBound = true;
              el.addEventListener('mouseenter', function () {
                playSfx('hover');
              });
            });
          }
        },
      };
    })();

    window.addEventListener('load', function () {
      window.__audio.bindSfx();
    });
  })();
</script>

<script>
  // sound-switcher.js
  // Читает состояние из window.__audio, синхронизирует кнопку.
  // Зависимости: audio.js (window.__audio).

  (function () {
    'use strict';

    function initSoundSwitcher() {
      var wrapper = document.querySelector('.sound-switcher');
      if (!wrapper) return;
      var switcher = wrapper.querySelector('.switcher');
      var soundOn = wrapper.querySelector('.sound-on');
      var soundOff = wrapper.querySelector('.sound-off');
      if (!switcher || !soundOn || !soundOff) return;

      var isOn = window.__audio ? window.__audio.isEnabled() : false;

      function getOffset() {
        var a = soundOn.getBoundingClientRect();
        var b = soundOff.getBoundingClientRect();
        return b.left + b.width / 2 - (a.left + a.width / 2);
      }

      wrapper.classList.toggle('is-off', !isOn);
      requestAnimationFrame(function () {
        switcher.style.transition = 'none';
        switcher.style.transform = isOn ? 'translateX(0px)' : 'translateX(' + getOffset() + 'px)';
        requestAnimationFrame(function () {
          switcher.style.transition = '';
        });
      });

      if (wrapper.__switcherBound) return;
      wrapper.__switcherBound = true;

      wrapper.addEventListener('click', function () {
        isOn = !isOn;
        wrapper.classList.toggle('is-off', !isOn);
        switcher.style.transform = isOn ? 'translateX(0px)' : 'translateX(' + getOffset() + 'px)';
        if (window.__audio) window.__audio.setEnabled(isOn);
      });
    }

    window.__initSoundSwitcher = initSoundSwitcher;
    initSoundSwitcher();
  })();
</script>

<script>
  // logo-rotation.js
  // Активно только на /discography и /merch.
  (function () {
    'use strict';
    function initLogoRotation() {
      var path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (['/discography', '/merch'].indexOf(path) === -1) return;
      var logo = document.querySelector('.image-logo');
      if (!logo) return;

      // --- Определяем мобилку ---
      var isMobile = window.matchMedia('(max-width: 767px)').matches;

      var rotation = 0;
      var targetRot = 0;
      var lerpSpeed = 0.06;

      // --- Мобильные значения: вращение быстрее, доезд живее ---
      var snapSpeed   = isMobile ? 0.09 : 0.12;  // выше = быстрее/резче доезд
      var multiplier  = isMobile ? 140  : 85;    // выше = сильнее вращение
      var idleDelay   = isMobile ? 100  : 200;   // ниже = доезд начинается раньше

      var lastMoveTime = 0;
      var isSnapping = false;
      if (logo.parentElement) logo.parentElement.style.perspective = '800px';
      logo.style.willChange = 'transform';
      function tick() {
        var carSpeed = window.__carouselSpeed || 0;
        var now = Date.now();
        if (Math.abs(carSpeed) > 0.0005) {
          targetRot += carSpeed * multiplier;
          lastMoveTime = now;
          isSnapping = false;
        } else if (now - lastMoveTime > idleDelay && !isSnapping) {
          isSnapping = true;
        }
        if (isSnapping) {
          var snapTo = Math.round(targetRot / 360) * 360;
          targetRot += (snapTo - targetRot) * snapSpeed;
          if (Math.abs(targetRot - snapTo) < 0.3) targetRot = snapTo;
        }
        rotation += (targetRot - rotation) * lerpSpeed;
        logo.style.transform = 'rotateY(' + (rotation % 360) + 'deg)';
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
    window.__initLogoRotation = initLogoRotation;
    initLogoRotation();
  })();
</script>

<script>
  // nav-overlay.js — fix: динамический пересчёт isHomepage вместо замыкания
  // + плавное появление .link_menu после закрытия меню
  (function () {
    'use strict';

    var CONFIG = {
      homePaths: ['/', '/index', '/home', ''],
      attractionFactors: [0.01, 0.02, 0.035, 0.05, 0.065, 0.08],
      dampingSpeed: 8,
      timing: {
        iconFade: 0.15,
        overlayFade: 0.45,
        ghostFly: 0.6,
        circleStagger: 0.07,
        circleAppear: 0.4,
        textStagger: 0.06,
        textFade: 0.35,
        exitCircle: 0.3,
        exitStagger: 0.05,
        exitText: 0.15,
        // плавное возвращение .link_menu после закрытия
        linkMenuReturn: 0.6,
        linkMenuReturnDelay: 0.1,
        // плавное затухание фона .link_menu / .point при открытии
        bgFade: 0.25,
      },
      storageKey: 'circle-nav-transition',
    };

    var overlay = document.querySelector('.nav-overlay');
    var container = overlay ? overlay.querySelector('.circles-container') : null;
    var circles = overlay ? overlay.querySelectorAll('.circle') : [];

    if (!overlay || !circles.length) return;

    var isMobile = window.matchMedia('(max-width: 768px)').matches;

    function getCurrentPath() {
      return window.location.pathname.replace(/\/+$/, '') || '/';
    }
    function isHomepageNow() {
      return CONFIG.homePaths.indexOf(getCurrentPath()) !== -1;
    }

    var menuOpen = false;
    var animating = false;
    var magneticEnabled = false;

    var circlesArr = Array.from(circles);
    var circlesReversed = [...circlesArr].reverse();

    var activeLinkMenu = document.querySelector('.link_menu');
    var activeIconMenu = activeLinkMenu ? activeLinkMenu.querySelector('.icon-menu') : null;

    function buildCurvedText() {
      var fontSize = isMobile ? 14 : 16;
      var ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '500 ' + fontSize + 'px "Public Sans", sans-serif';
      var spaceWidth = Math.max(ctx.measureText(' ').width, fontSize * 0.35);
      var charHeight = fontSize;
      var gap = 0.5;

      circlesArr.forEach(function (circle, index) {
        if (index === circlesArr.length - 1) {
          var oldRing = circle.querySelector('.text-ring');
          if (oldRing) oldRing.remove();
          var label = circle.querySelector('.static-label');
          if (!label) {
            label = document.createElement('div');
            label.className = 'static-label';
            label.style.cssText = 'position:absolute;top:50%;left:50%;' + 'transform:translate(-50%,-50%);' + 'font-size:' + fontSize + 'px;' + 'font-weight:500;' + 'font-family:"Public Sans",sans-serif;' + 'white-space:nowrap;opacity:0;pointer-events:none;';
            circle.appendChild(label);
          }
          label.textContent = circle.getAttribute('data-text') || '';
          return;
        }

        var text = circle.getAttribute('data-text');
        if (!text) return;

        var old = circle.querySelector('.text-ring');
        if (old) old.remove();

        var outerR = circle.offsetWidth / 2;
        var nextCircle = circlesArr[index + 1];
        var innerR = nextCircle ? nextCircle.offsetWidth / 2 : 0;
        var textRadius = (outerR + innerR) / 2;

        var chars = text.split('');
        var charWidths = chars.map(function (ch) {
          return ch === ' ' ? spaceWidth : ctx.measureText(ch).width;
        });

        var totalArc =
          charWidths.reduce(function (s, w) {
            return s + w;
          }, 0) +
          (chars.length - 1) * gap;

        var currentArc = -totalArc / 2;

        var textRing = document.createElement('div');
        textRing.className = 'text-ring';
        if (index % 2 !== 0) textRing.style.animationDirection = 'reverse';
        textRing.style.animationDelay = '-' + Math.random() * 30 + 's';
        textRing.style.opacity = '0';

        chars.forEach(function (char, i) {
          var charCenterArc = currentArc + charWidths[i] / 2;
          var angleRad = charCenterArc / textRadius;
          var angleDeg = angleRad * (180 / Math.PI);
          var px = Math.sin(angleRad) * textRadius;
          var py = -Math.cos(angleRad) * textRadius;

          var span = document.createElement('span');
          span.innerText = char;
          span.className = 'char';
          span.style.transform = 'translate(' + px + 'px, ' + py + 'px) rotate(' + angleDeg + 'deg)';
          span.style.marginLeft = -charWidths[i] / 2 + 'px';
          span.style.marginTop = -charHeight / 2 + 'px';
          textRing.appendChild(span);
          currentArc += charWidths[i] + gap;
        });

        circle.appendChild(textRing);
      });

      overlay.querySelectorAll('.static-text').forEach(function (st) {
        st.style.opacity = '0';
      });
    }

    var center = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    var positions = circlesArr.map(function () {
      return { x: 0, y: 0 };
    });
    var targets = circlesArr.map(function () {
      return { x: 0, y: 0 };
    });
    var lastTime = 0;

    function resetMagnetic() {
      circlesArr.forEach(function (c, i) {
        positions[i].x = 0;
        positions[i].y = 0;
        targets[i].x = 0;
        targets[i].y = 0;
        c.style.transform = 'translate(-50%, -50%)';
      });
      lastTime = 0;
    }

    function stopMagnetic() {
      magneticEnabled = false;
      circlesArr.forEach(function (_, i) {
        targets[i].x = 0;
        targets[i].y = 0;
      });
    }

    if (!isMobile) {
      document.addEventListener('mousemove', function (e) {
        if (!magneticEnabled) return;
        var dx = e.clientX - center.x;
        var dy = e.clientY - center.y;
        circlesArr.forEach(function (_, i) {
          var f = CONFIG.attractionFactors[i] || 0;
          targets[i].x = dx * f;
          targets[i].y = dy * f;
        });
      });

      document.addEventListener('mouseleave', function () {
        circlesArr.forEach(function (_, i) {
          targets[i].x = 0;
          targets[i].y = 0;
        });
      });

      (function tick(now) {
        requestAnimationFrame(tick);
        if (!magneticEnabled) {
          lastTime = 0;
          return;
        }
        if (!lastTime) {
          lastTime = now;
          return;
        }
        var dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        var alpha = 1 - Math.exp(-CONFIG.dampingSpeed * dt);
        circlesArr.forEach(function (circle, i) {
          positions[i].x += (targets[i].x - positions[i].x) * alpha;
          positions[i].y += (targets[i].y - positions[i].y) * alpha;
          circle.style.transform = 'translate(calc(-50% + ' + positions[i].x + 'px), calc(-50% + ' + positions[i].y + 'px))';
        });
      })(0);

      window.addEventListener('resize', function () {
        center.x = window.innerWidth / 2;
        center.y = window.innerHeight / 2;
      });
    }

    function enableInteraction() {
      menuOpen = true;
      animating = false;
      if (!isMobile) magneticEnabled = true;
      container.style.pointerEvents = 'auto';
      circlesArr.forEach(function (c) {
        c.style.pointerEvents = 'auto';
      });
    }

    function disableInteraction() {
      stopMagnetic();
      container.style.pointerEvents = 'none';
      circlesArr.forEach(function (c) {
        c.style.pointerEvents = 'none';
      });
    }

    function getTextEls() {
      return circlesReversed
        .map(function (c) {
          return c.querySelector('.text-ring') || c.querySelector('.static-text') || c.querySelector('.static-label');
        })
        .filter(Boolean);
    }

    function playEnterAnimation(onComplete) {
      var T = CONFIG.timing;
      resetMagnetic();
      gsap.set(circlesArr, { scale: 0.95, opacity: 0 });
      gsap.set('.nav-overlay .text-ring, .nav-overlay .static-text, .nav-overlay .static-label', { opacity: 0 });

      var tl = gsap.timeline({
        onComplete: function () {
          enableInteraction();
          if (onComplete) onComplete();
        },
      });
      tl.to(circlesReversed, { scale: 1, opacity: 1, duration: T.circleAppear, stagger: T.circleStagger, ease: 'power2.out' });
      tl.to(getTextEls(), { opacity: 1, duration: T.textFade, stagger: T.textStagger, ease: 'power1.out' }, '-=0.15');
      return tl;
    }

    function playExitAnimation(onComplete) {
      var T = CONFIG.timing;
      disableInteraction();
      var tl = gsap.timeline({ onComplete: onComplete });
      tl.to('.nav-overlay .text-ring, .nav-overlay .static-text, .nav-overlay .static-label', { opacity: 0, duration: T.exitText, ease: 'power1.in' });
      tl.to(circlesReversed, { opacity: 0, duration: T.exitCircle, stagger: T.exitStagger, ease: 'power2.in' }, '-=0.05');
      return tl;
    }

    function openMenu() {
      if (animating || menuOpen || !activeLinkMenu) return;
      animating = true;
      var T = CONFIG.timing;
      var rect = activeLinkMenu.getBoundingClientRect();
      var centerCircle = circlesArr[circlesArr.length - 1];
      var centerSize = centerCircle ? centerCircle.offsetWidth : 90;
      var ghost = document.createElement('div');
      ghost.className = 'menu-ghost';
      ghost.style.top = rect.top + 'px';
      ghost.style.left = rect.left + 'px';
      ghost.style.width = rect.width + 'px';
      ghost.style.height = rect.height + 'px';
      ghost.style.background = 'transparent';
      document.body.appendChild(ghost);

      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      overlay.classList.add('is-visible');
      resetMagnetic();
      gsap.set(circlesArr, { scale: 0.95, opacity: 0 });
      gsap.set('.nav-overlay .text-ring, .nav-overlay .static-text, .nav-overlay .static-label', { opacity: 0 });

      var targetX = window.innerWidth / 2 - centerSize / 2;
      var targetY = window.innerHeight / 2 - centerSize / 2;
      var point = activeLinkMenu.querySelector('.point');
      var tl = gsap.timeline();

      activeLinkMenu.style.transition = 'none';

      tl.to(
        activeLinkMenu,
        {
          opacity: 0,
          duration: T.bgFade,
          ease: 'power1.out',
        },
        0,
      );

      tl.set(activeLinkMenu, { visibility: 'hidden' });
      tl.to(ghost, { top: targetY, left: targetX, width: centerSize, height: centerSize, duration: T.ghostFly, ease: 'power3.inOut' });
      tl.to(overlay, { opacity: 1, duration: T.overlayFade, ease: 'power2.inOut' }, '<');
      tl.call(function () {
        gsap.set(centerCircle, { scale: 1, opacity: 1 });
        ghost.remove();
        overlay.style.pointerEvents = 'auto';
      });
      tl.to(circlesReversed.slice(1), { scale: 1, opacity: 1, duration: T.circleAppear, stagger: T.circleStagger, ease: 'power2.out' });
      tl.to(getTextEls(), { opacity: 1, duration: T.textFade, stagger: T.textStagger, ease: 'power1.out' }, '-=0.15');
      tl.call(function () {
        enableInteraction();
      });
    }

    function closeMenu() {
      if (animating || !menuOpen) return;
      animating = true;
      var T = CONFIG.timing;
      playExitAnimation(function () {
        gsap.to(overlay, {
          opacity: 0,
          duration: T.overlayFade,
          ease: 'power2.inOut',
          onComplete: function () {
            overlay.classList.remove('is-visible');
            overlay.style.pointerEvents = 'none';
            resetMagnetic();
            gsap.set(circlesArr, { scale: 1, opacity: 1 });
            menuOpen = false;
            animating = false;

            if (activeLinkMenu) {
              activeLinkMenu.style.transition = 'none';
              gsap.set(activeLinkMenu, { opacity: 0 });
              gsap.set(activeLinkMenu, {
                clearProps: 'visibility,backgroundColor,borderColor,boxShadow',
              });
              var pointEl = activeLinkMenu.querySelector('.point');
              if (pointEl) gsap.set(pointEl, { clearProps: 'backgroundColor' });
              gsap.set(activeLinkMenu, { opacity: 0 });
              gsap.to(activeLinkMenu, {
                opacity: 1,
                duration: T.linkMenuReturn,
                delay: T.linkMenuReturnDelay,
                ease: 'power2.out',
                onComplete: function () {
                  activeLinkMenu.style.transition = '';
                },
              });
            }
          },
        });
      });
    }

    function navigateTo(href) {
      if (animating) return;
      try {
        var url = new URL(href, window.location.origin);
        if (url.origin !== window.location.origin) {
          window.open(href, '_blank');
          return;
        }
      } catch (e) {}

      var currentPath = window.location.pathname.replace(/\/+$/, '') || '/';
      var targetPath = new URL(href, window.location.origin).pathname.replace(/\/+$/, '') || '/';
      if (currentPath === targetPath) {
        closeMenu();
        return;
      }

      animating = true;
      playExitAnimation(function () {});

      if (window.barba) {
        window.barba.go(href);
      } else {
        window.location.href = href;
      }
    }

    window.addEventListener('barba:pageEnter', function (e) {
      var newPath = (e.detail && e.detail.path) || getCurrentPath();
      var newIsHome = CONFIG.homePaths.indexOf(newPath) !== -1;

      menuOpen = false;
      animating = false;

      activeLinkMenu = document.querySelector('.link_menu');
      activeIconMenu = activeLinkMenu ? activeLinkMenu.querySelector('.icon-menu') : null;

      var header = document.querySelector('.header');
      if (header) {
        header.style.opacity = '';
        header.style.pointerEvents = '';
      }

      if (newIsHome) {
        overlay.classList.add('is-visible');
        overlay.style.opacity = '1';
        overlay.style.pointerEvents = 'auto';
        if (activeLinkMenu) activeLinkMenu.style.display = 'none';
        buildCurvedText();
        playEnterAnimation();
      } else {
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        gsap.set(circlesArr, { scale: 0.95, opacity: 0 });
        overlay.classList.remove('is-visible');

        if (activeLinkMenu) {
          activeLinkMenu.style.display = '';
          activeLinkMenu.style.visibility = 'visible';
          gsap.set(activeLinkMenu, { clearProps: 'all' });
          if (activeIconMenu) gsap.set(activeIconMenu, { opacity: 1 });

          var newLm = activeLinkMenu.cloneNode(true);
          activeLinkMenu.parentNode.replaceChild(newLm, activeLinkMenu);
          activeLinkMenu = newLm;
          activeIconMenu = newLm.querySelector('.icon-menu');
          activeLinkMenu.addEventListener('click', function (e) {
            e.preventDefault();
            openMenu();
          });
        }
      }
    });

    circlesArr.forEach(function (circle) {
      circle.addEventListener('click', function (e) {
        if (!menuOpen || animating) return;
        e.preventDefault();
        var href = circle.getAttribute('href') || (circle.closest('a') && circle.closest('a').getAttribute('href'));
        if (href) navigateTo(href);
      });
    });

    overlay.addEventListener('click', function (e) {
      if (isHomepageNow()) return;
      if (e.target === overlay || e.target === container) closeMenu();
    });

    window.addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      document.documentElement.classList.remove('nav-transitioning');
      resetMagnetic();

      if (!isHomepageNow()) {
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        overlay.classList.remove('is-visible');
        gsap.set(circlesArr, { scale: 1, opacity: 1 });
        menuOpen = false;
        animating = false;
        if (activeLinkMenu) {
          gsap.set(activeLinkMenu, { clearProps: 'all' });
          activeLinkMenu.style.display = '';
          activeLinkMenu.style.visibility = 'visible';
        }
        if (activeIconMenu) gsap.set(activeIconMenu, { opacity: 1 });
      } else {
        overlay.classList.add('is-visible');
        overlay.style.opacity = '1';
        overlay.style.pointerEvents = 'auto';
        animating = false;
        menuOpen = false;
        playEnterAnimation();
      }
    });

    window.addEventListener('popstate', function () {
      try {
        sessionStorage.removeItem(CONFIG.storageKey);
      } catch (e) {}
    });

    function init() {
      buildCurvedText();
      try {
        sessionStorage.removeItem(CONFIG.storageKey);
      } catch (e) {}
      document.documentElement.classList.remove('nav-transitioning');

      if (isHomepageNow()) {
        overlay.classList.add('is-visible');
        overlay.style.opacity = '1';
        overlay.style.pointerEvents = 'auto';
        if (activeLinkMenu) activeLinkMenu.style.display = 'none';
        playEnterAnimation();
      } else {
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        gsap.set(circlesArr, { scale: 0.95, opacity: 0 });
        if (activeLinkMenu) {
          activeLinkMenu.addEventListener('click', function (e) {
            e.preventDefault();
            openMenu();
          });
        }
      }
    }

    if (document.readyState === 'complete') {
      init();
    } else {
      window.addEventListener('load', init);
    }
  })();
</script>

<script>
  (function () {
    const TRIGGER_SELECTOR = '.image-logo';
    const POPUP_SELECTOR = '.message-inner';
    const TEXT_SELECTOR = '.text-message';
    const COUNTER_SELECTOR = '.utility-text.counter';
    const SHOW_MS = 200; // длительность появления (0.2s)
    const HIDE_MS = 2500; // длительность скрытия (с 1.5s до 4s = 2.5s)
    const VISIBLE_MS = 1500; // когда начинается пропадание (1.5s)
    const RESTART_FADE_MS = 200; // быстрое исчезновение перед перезаходом по клику

    const MESSAGES = ['thank you for staying there and listening to my music <3', '╮ (. ❛ ᴗ ❛.) ╭', 'please water the sound', '(⁠ ⁠◜⁠‿⁠◝⁠ ⁠)⁠♡', 'not everything here is a button', '(((o(*°▽°*)o)))', 'wrong button, right feeling', 'ಠ⁠︵⁠ಠ', 'certified organic click', '⸜(｡˃ ᵕ ˂ )⸝♡', 'you are now 3% more tender', 'a tiny frequency just noticed you', 'hey...', 'how are you?', 'how are you feeling?', 'this page is pretending to be normal', 'soft error: too much heart', 'the website is breathing slowly'];

    const trigger = document.querySelector(TRIGGER_SELECTOR);
    const popup = document.querySelector(POPUP_SELECTOR);
    if (!trigger || !popup) return;

    const textEl = popup.querySelector(TEXT_SELECTOR);
    const counterEl = popup.querySelector(COUNTER_SELECTOR);

    let hideTimer = null; // таймер автоскрытия
    let displayTimer = null; // таймер на display:none после fade-out
    let restartTimer = null; // таймер «перезахода» при повторном клике
    let counterInterval = null; // интервал обновления счётчика
    let isActive = false; // попап на экране или исчезает — клик должен делать restart
    let lastIndex = -1; // индекс предыдущего сообщения

    function randomMessage() {
      if (MESSAGES.length <= 1) {
        lastIndex = 0;
        return MESSAGES[0] || '';
      }
      let i;
      do {
        i = Math.floor(Math.random() * MESSAGES.length);
      } while (i === lastIndex);
      lastIndex = i;
      return MESSAGES[i];
    }

    function startCounter() {
      let seconds = 1;
      if (counterEl) counterEl.textContent = seconds + 's ago';

      if (counterInterval) clearInterval(counterInterval);
      counterInterval = setInterval(function () {
        seconds++;
        if (seconds > 4) {
          clearInterval(counterInterval);
          counterInterval = null;
          return;
        }
        if (counterEl) counterEl.textContent = seconds + 's ago';
      }, 1000);
    }

    function stopCounter() {
      if (counterInterval) {
        clearInterval(counterInterval);
        counterInterval = null;
      }
    }

    function clearAllTimers() {
      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
      if (displayTimer) {
        clearTimeout(displayTimer);
        displayTimer = null;
      }
      if (restartTimer) {
        clearTimeout(restartTimer);
        restartTimer = null;
      }
    }

    function animateIn() {
      if (textEl) textEl.textContent = randomMessage();
      startCounter();

      popup.style.transition = 'none';
      popup.style.opacity = '0';
      popup.style.transform = 'scale(0.9)';

      void popup.offsetWidth;

      popup.style.transition = 'opacity ' + SHOW_MS / 1000 + 's ease, transform ' + SHOW_MS / 1000 + 's ease';
      popup.style.opacity = '1';
      popup.style.transform = 'scale(1)';

      isActive = true;

      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(hide, VISIBLE_MS);
    }

    function show() {
      clearAllTimers();
      popup.style.display = 'block';
      animateIn();
    }

    function restart() {
      clearAllTimers();
      stopCounter();

      popup.style.transition = 'opacity ' + RESTART_FADE_MS / 1000 + 's ease, transform ' + RESTART_FADE_MS / 1000 + 's ease';
      popup.style.opacity = '0';
      popup.style.transform = 'scale(0.9)';

      restartTimer = setTimeout(function () {
        restartTimer = null;
        animateIn();
      }, RESTART_FADE_MS);
    }

    function hide() {
      if (!isActive) return;

      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
      stopCounter();

      popup.style.transition = 'opacity ' + HIDE_MS / 1000 + 's ease, transform ' + HIDE_MS / 1000 + 's ease';
      popup.style.opacity = '0';
      popup.style.transform = 'scale(0.9)';

      if (displayTimer) clearTimeout(displayTimer);
      displayTimer = setTimeout(function () {
        popup.style.display = 'none';
        displayTimer = null;
        isActive = false; // только теперь попап действительно исчез
      }, HIDE_MS);
    }

    trigger.addEventListener('click', function (e) {
      e.preventDefault();
      if (isActive) {
        restart();
      } else {
        show();
      }
    });
  })();
</script>

<script>
(function () {
  // Брейкпоинты Webflow по умолчанию:
  // desktop: >= 992px
  // tablet: 768–991px
  // mobile landscape: 480–767px
  // mobile portrait: < 480px
  function getBreakpoint() {
    var w = window.innerWidth;
    if (w >= 992) return 'desktop';
    if (w >= 768) return 'tablet';
    if (w >= 480) return 'mobileLandscape';
    return 'mobilePortrait';
  }

  var currentBreakpoint = getBreakpoint();
  var DEBOUNCE_MS = 250;
  var resizeTimer = null;

  function onResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var newBreakpoint = getBreakpoint();
      if (newBreakpoint !== currentBreakpoint) {
        currentBreakpoint = newBreakpoint;
        window.location.reload();
      }
    }, DEBOUNCE_MS);
  }

  window.addEventListener('resize', onResize, { passive: true });
})();
</script>

<script>
(function () {
  if (window.__logoPulse) return;
  window.__logoPulse = true;

  function bindLogoPulse() {
    var logos = document.querySelectorAll('.image-logo');
    if (!logos.length) return;

    // Определяем тач-устройство
    var isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches
      || ('ontouchstart' in window)
      || navigator.maxTouchPoints > 0;

    function pulse(el) {
      // Прерываем предыдущую анимацию, если она ещё идёт
      gsap.killTweensOf(el);
      gsap.timeline()
        .to(el, { scale: 1.1, duration: 0.2, ease: 'back.out' })
        .to(el, { scale: 1, duration: 0.2, ease: 'back.out' });
    }

    logos.forEach(function (el) {
      // Защита от повторного навешивания после Barba-перехода
      if (el.__pulseBound) return;
      el.__pulseBound = true;

      gsap.set(el, { transformOrigin: '50% 50%' });

      // Клик работает на всех устройствах
      el.addEventListener('click', function () {
        pulse(el);
      });

      // Наведение — только на десктопе (не-тач)
      if (!isTouch) {
        el.addEventListener('mouseenter', function () {
          pulse(el);
        });
      }
    });
  }

  // Инициализация
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindLogoPulse);
  } else {
    bindLogoPulse();
  }

  // Реинициализация после Barba-переходов
  if (window.barba) {
    barba.hooks.afterEnter(function () {
      bindLogoPulse();
    });
  }
})();
